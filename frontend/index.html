<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彩陶名称检查与命名系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 利用 Tailwind 的 @apply 提取公共组件样式，精简 HTML 标签 -->
    <style type="text/tailwindcss">
        @layer components {
            .card {
                @apply bg-white p-5 border border-stone-200; /* 扁平化，无阴影，缩小 padding */
            }
            .section-title {
                @apply text-xl font-medium mb-6 pb-2 border-b border-stone-200 text-orange-900;
            }
            .form-label {
                @apply block text-base mb-2 text-stone-600;
            }
            .form-input {
                @apply w-full border border-stone-300 bg-stone-50 p-3 text-base focus:border-orange-800 focus:bg-white focus:ring-0 outline-none transition-colors;
            }
            .btn-primary {
                @apply w-full bg-orange-900 text-stone-50 text-lg py-3 hover:bg-orange-800 transition-colors duration-200;
            }
        }
    </style>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body class="bg-stone-100 min-h-screen p-4 text-stone-800 font-sans">
    <div class="max-w-[1400px] mx-auto">
        <h1 class="text-3xl font-medium mb-8 mt-2 text-orange-900 tracking-wide">彩陶名称检查与命名系统</h1>

        <div class="grid grid-cols-1 xl:grid-cols-12 gap-8 items-start">
            <!-- ================= 左侧：信息输入区 ================= -->
            <div class="card xl:col-span-4">
                <h2 class="section-title">输入多源信息</h2>
                <form id="potteryForm" class="space-y-4">
                    <!-- 1. 图片上传 -->
                    <div>
                        <label class="form-label">图片上传 (支持多图)</label>
                        <input type="file" id="imageInput" accept="image/*" class="hidden" multiple />
                        <label id="uploadBox" for="imageInput" class="upload-box">
                            <span id="uploadPlaceholder" class="text-stone-400 text-sm">📷 点击上传图片 (支持多张，可多次上传)</span>
                        </label>
                        <div id="previewGrid" class="grid grid-cols-3 gap-2 mt-2"></div>
                    </div>
                    <!-- 2. 原参考名 -->
                    <div>
                        <label class="form-label">原参考名</label>
                        <div class="flex gap-2">
                            <input type="text" id="originalName" placeholder="例如：马家窑文化黑彩网格纹壶" class="form-input flex-1">
                            <button type="button" id="btnParseName"
                                class="bg-orange-900 text-stone-50 px-4 hover:bg-orange-800 transition-colors whitespace-nowrap hidden">拆解原名</button>
                        </div>
                    </div>
                    <!-- 3. 结构化信息 -->
                    <div>
                        <label class="form-label">结构化信息</label>
                        <div class="flex gap-4 p-4 border border-stone-200 rounded-md bg-stone-50/50">
                            <div class="flex-1">
                                <label class="block text-sm text-stone-600 mb-2">时代</label>
                                <input type="text" id="eraInput" placeholder="例如：新石器时代" class="form-input">
                            </div>
                            <div class="flex-1">
                                <label class="block text-sm text-stone-600 mb-2">所属文化</label>
                                <input type="text" id="cultureInput" placeholder="例如：仰韶文化" class="form-input">
                            </div>
                        </div>
                    </div>
                    <!-- 4. 文字描述 -->
                    <div>
                        <label class="form-label">文字描述</label>
                        <textarea id="description" rows="3" class="form-input"></textarea>
                    </div>

                    <div class="space-y-4 mt-6">
                        <button type="button" id="btnGenerateName" class="hidden">仅生成推荐命名</button>
                        <div class="flex gap-4">
                            <button type="button" id="btnAnalyzeBoth"
                                class="w-full bg-orange-900 text-stone-50 text-lg py-3 hover:bg-orange-800 transition-colors duration-200 font-bold flex-[2]">生成推荐命名</button>
                            <button type="button" id="btnLoadExample"
                                class="w-full bg-stone-200 text-stone-700 text-lg py-3 hover:bg-stone-300 transition-colors duration-200 flex-[1]">导入示例</button>
                            <button type="button" id="btnClearAll"
                                class="w-full bg-stone-200 text-stone-700 text-lg py-3 hover:bg-stone-300 transition-colors duration-200 flex-[1]">清空</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- ================= 右侧：结果展示区 ================= -->
            <div class="card xl:col-span-8">
                <h2 class="section-title">名称检查与命名结果</h2>
                <div id="analysisResult" class="space-y-4">
                    <p id="welcomePlaceholder" class="text-stone-500 italic leading-relaxed">
                        请在左侧上传图片、填写原参考名并输入其他结构化信息后，点击下方相应的分析按钮。<br><br>
                        - 点击 <b>“拆解原名并生成推荐命名”</b>，系统将同时对原名进行拆解、并基于您提供的数据（包括多图特征）生成全新且带溯源的命名比对表。<br>
                        - 点击 <b>“清空”</b> 可以重置所有输入和结果。
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script src="scripts/api.js"></script>
    <script src="scripts/ui.js"></script>
    <script src="scripts/app.js"></script>
    <script src="scripts/upload.js"></script>
</body>

</html>
